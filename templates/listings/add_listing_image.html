{% extends 'listings/base.html' %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card-custom p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-camera text-primary" style="font-size: 2.5rem;"></i>
                    <h3 class="section-title mt-2 mb-1">Add a Photo</h3>
                    <p class="text-muted small">to <strong>"{{ listing.title }}"</strong></p>
                </div>
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label fw-medium">Choose Image</label>
                        {{ form.image }}
                        {% if form.image.errors %}
                        <div class="text-danger small mt-1">{{ form.image.errors }}</div>
                        {% endif %}
                        <div class="text-muted small mt-2">
                            <i class="bi bi-info-circle me-1"></i>Supported formats: JPG, PNG, WEBP
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4 py-2"><i class="bi bi-upload me-1"></i> Upload Photo</button>
                        <a href="{% url 'listing_detail' listing.pk %}" class="btn btn-outline-secondary px-4 py-2">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    input[type="file"] {
        border: 2px dashed var(--border);
        border-radius: 8px;
        padding: 1.5rem 1rem;
        width: 100%;
        background: var(--bg-alt);
        cursor: pointer;
        transition: all 0.2s;
    }
    input[type="file"]:hover {
        border-color: var(--primary);
        background: rgba(15, 118, 110, 0.04);
    }
    label { font-size: 0.85rem; }
    .btn-outline-secondary {
        border-color: var(--border);
        color: var(--text);
        border-radius: 8px;
        font-weight: 600;
    }
    .btn-outline-secondary:hover {
        background: #F3F4F6;
        border-color: #D1D5DB;
    }
</style>
{% endblock %}
