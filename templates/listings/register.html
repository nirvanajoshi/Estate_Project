{% extends 'listings/base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card-custom p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus text-primary" style="font-size: 2.5rem;"></i>
                    <h3 class="section-title mt-2 mb-1">Create Account</h3>
                    <p class="text-muted small">Join HomeFind to start exploring properties</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Create Account</button>
                </form>
                <div class="text-center mt-3">
                    <p class="text-muted small mb-0">Already have an account? <a href="{% url 'login' %}" class="text-primary text-decoration-none fw-medium">Sign In</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
<style>
    .card-custom { max-width: 450px; margin: 0 auto; }
    input[type="text"], input[type="password"] {
        width: 100%;
        padding: 0.625rem 0.875rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 0.95rem;
        transition: border-color 0.2s;
    }
    input[type="text"]:focus, input[type="password"]:focus {
        border-color: var(--primary);
        outline: none;
        box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1);
    }
    label { font-size: 0.9rem; color: var(--text); }
    .errorlist { list-style: none; padding: 0; margin: 0.25rem 0 0; color: #DC2626; font-size: 0.85rem; }
    .helptext { display: block; color: var(--text-muted); font-size: 0.8rem; margin-top: 0.25rem; }
</style>
{% endblock %}
